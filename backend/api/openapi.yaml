openapi: 3.0.3
info:
  title: OralHistory 口述历史采集工具 API
  description: 口述历史采集工具后端接口文档（Go 1.22 + Gin + GORM）
  version: 1.0.0
servers:
  - url: http://localhost:9180/api/v1
paths:
  /auth/register:
    post:
      summary: 用户注册
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                display_name: { type: string }
                email: { type: string }
                role: { type: string, enum: [admin, interviewer, archivist] }
      responses:
        '200': { description: 注册成功 }
  /auth/login:
    post:
      summary: 用户登录
      tags: [auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: 登录成功，返回 token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
  /auth/me:
    get:
      summary: 当前用户信息
      tags: [auth]
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: 用户信息 }
  /projects:
    get:
      summary: 项目列表（可按 status 筛选）
      tags: [projects]
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
    post:
      summary: 创建采访项目
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{id}:
    get: { summary: 项目详情, tags: [projects], security: [{ BearerAuth: [] }] }
    put: { summary: 更新项目, tags: [projects], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除项目, tags: [projects], security: [{ BearerAuth: [] }] }
  /projects/{id}/status:
    put:
      summary: 项目状态流转
      tags: [projects]
      security: [{ BearerAuth: [] }]
  /projects/{id}/outline-versions:
    get: { summary: 项目提纲版本列表（版本查看）, tags: [outline], security: [{ BearerAuth: [] }] }
    post: { summary: 采访员创建/复用草稿版本（可基于已通过版本）, tags: [outline], security: [{ BearerAuth: [] }] }
  /projects/{id}/outline-versions/{vid}:
    get: { summary: 提纲版本详情（含问题内容）, tags: [outline], security: [{ BearerAuth: [] }] }
  /projects/{id}/outline-versions/{vid}/questions:
    put: { summary: 采访员保存提纲草稿改动（新增/更新问题）, tags: [outline], security: [{ BearerAuth: [] }] }
  /projects/{id}/outline-versions/{vid}/questions/{qid}:
    delete: { summary: 删除草稿版本中的问题, tags: [outline], security: [{ BearerAuth: [] }] }
  /projects/{id}/outline-versions/{vid}/submit:
    post: { summary: 采访员提交提纲审核（重复提交被拒绝）, tags: [outline], security: [{ BearerAuth: [] }] }
  /outlines/pending:
    get: { summary: 待审核提纲列表（仅档案员/管理员）, tags: [outline], security: [{ BearerAuth: [] }] }
  /outlines/{vid}/review:
    post: { summary: 审核提纲：approve 通过锁定 / reject 退回（reason 必填）, tags: [outline], security: [{ BearerAuth: [] }] }
  /recordings:
    get:
      summary: 录音列表（project_id 或 question_id）
      tags: [recordings]
      security: [{ BearerAuth: [] }]
    post: { summary: 创建录音记录, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}:
    get: { summary: 录音详情, tags: [recordings], security: [{ BearerAuth: [] }] }
    put: { summary: 更新录音, tags: [recordings], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除录音, tags: [recordings], security: [{ BearerAuth: [] }] }
  /recordings/{id}/audio:
    post: { summary: 上传录音文件(multipart), tags: [recordings], security: [{ BearerAuth: [] }] }
    get: { summary: 播放录音音频流, tags: [recordings], security: [{ BearerAuth: [] }] }
  /timeline-markers:
    get:
      summary: 时间轴节点列表（project_id 或 recording_id）
      tags: [timeline]
      security: [{ BearerAuth: [] }]
    post: { summary: 标注时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /timeline-markers/{id}:
    put: { summary: 更新时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
    delete: { summary: 删除时间轴节点, tags: [timeline], security: [{ BearerAuth: [] }] }
  /audit-logs:
    get:
      summary: 审计日志列表（仅管理员）
      tags: [audit]
      security: [{ BearerAuth: [] }]
  /users:
    get: { summary: 用户列表（仅管理员）, tags: [users], security: [{ BearerAuth: [] }] }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
